name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
jobs:
  web:
    name: Typecheck · Lint · Unit · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm -r test
      - run: pnpm -r build
      - run: pnpm audit --audit-level=high || echo "::warning::npm audit reported issues"
  db:
    name: Migrations + RLS tests (PostgreSQL 15)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Run migrations and SQL tests
        env: { PGPASSWORD: postgres }
        run: PSQL="psql -h localhost -U postgres" bash supabase/tests/run_local.sh
  functions:
    name: Edge Functions typecheck (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - run: cmp packages/shared/src/maps.ts supabase/functions/_shared/maps.ts   # shared parser copies must match
      - run: cd supabase/functions && deno lint && deno check login/index.ts admin-users/index.ts telegram-webhook/index.ts telegram-sender/index.ts resolve-maps-link/index.ts
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
