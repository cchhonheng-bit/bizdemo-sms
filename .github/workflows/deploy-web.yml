name: Deploy WEB (Cloudflare Pages)
# main → https://oneteam.bizdemo.app (production) · develop → https://staging.bizdemo.app (D-34)
on:
  push:
    branches: [main, develop]
    paths: ["apps/web/**", "packages/**", "pnpm-lock.yaml", ".github/workflows/deploy-web.yml", "scripts/cf_pages_domain.py"]
  workflow_dispatch:
concurrency: deploy-web-${{ github.ref_name }}
env:
  IS_PROD: ${{ github.ref_name == 'main' }}
  # Public build-time values (publishable keys are public by design; secrets stay in GitHub/Supabase secrets).
  # Staging values come from repository VARIABLES (Settings → Secrets and variables → Actions → Variables):
  #   STAGING_SUPABASE_URL, STAGING_SUPABASE_PUBLISHABLE_KEY, STAGING_TELEGRAM_BOT
  VITE_SUPABASE_URL: ${{ github.ref_name == 'main' && 'https://terarlorrogcdksnratm.supabase.co' || vars.STAGING_SUPABASE_URL }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ github.ref_name == 'main' && 'sb_publishable_5t4VEKMboyl-IjHRThhKuA_UFEc2IXr' || vars.STAGING_SUPABASE_PUBLISHABLE_KEY }}
  VITE_TELEGRAM_BOT: ${{ github.ref_name == 'main' && 'Oneteam_app_bot' || vars.STAGING_TELEGRAM_BOT }}
  VITE_APP_NAME: ${{ github.ref_name == 'main' && 'One Team Service' || 'One Team Service (Staging)' }}
  VITE_APP_SHORT: ${{ github.ref_name == 'main' && 'One Team' || 'OT Staging' }}
  CF_PROJECT: ${{ github.ref_name == 'main' && 'oneteam-sms' || 'oneteam-sms-staging' }}
  CF_DOMAIN: ${{ github.ref_name == 'main' && 'oneteam.bizdemo.app' || 'staging.bizdemo.app' }}
  CF_ZONE: bizdemo.app
  HAS_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && (github.ref_name == 'main' || vars.STAGING_SUPABASE_URL != '') }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - name: Secrets present?
        if: env.HAS_SECRETS != 'true'
        run: echo "::notice title=Deploy skipped (${{ github.ref_name }})::Set CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID (secrets) and, for develop, STAGING_SUPABASE_URL + STAGING_SUPABASE_PUBLISHABLE_KEY (variables)."
      - uses: actions/checkout@v4
        if: env.HAS_SECRETS == 'true'
      - uses: pnpm/action-setup@v4
        if: env.HAS_SECRETS == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_SECRETS == 'true'
        with: { node-version: 22, cache: pnpm }
      - name: Build (${{ github.ref_name == 'main' && 'production' || 'staging' }})
        if: env.HAS_SECRETS == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm -F @sms/web build
          test -f apps/web/dist/_headers && test -f apps/web/dist/_redirects
      - name: Create Pages project (idempotent)
        if: env.HAS_SECRETS == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages project create "$CF_PROJECT" --production-branch=main 2>&1 | tee /tmp/create.log || grep -qi "already exists" /tmp/create.log
      - name: Deploy to Pages
        if: env.HAS_SECRETS == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # each environment is its own Pages project, so both deploy to that project's production branch
        run: npx --yes wrangler@3 pages deploy apps/web/dist --project-name="$CF_PROJECT" --branch=main --commit-dirty=true
      - name: Custom domain + DNS (idempotent)
        if: env.HAS_SECRETS == 'true'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/cf_pages_domain.py
