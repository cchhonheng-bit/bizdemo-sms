name: Deploy WEB (Cloudflare Pages)
on:
  push:
    branches: [main]
    paths: ["apps/web/**", "packages/**", "pnpm-lock.yaml", ".github/workflows/deploy-web.yml"]
  workflow_dispatch:
concurrency: deploy-web
env:
  # Public build-time values (the publishable key is public by design; secrets stay in GitHub/Supabase secrets)
  VITE_SUPABASE_URL: https://terarlorrogcdksnratm.supabase.co
  VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_5t4VEKMboyl-IjHRThhKuA_UFEc2IXr
  VITE_TELEGRAM_BOT: Oneteam_app_bot
  VITE_APP_NAME: One Team Service
  VITE_APP_SHORT: One Team
  CF_PROJECT: oneteam-sms
  CF_DOMAIN: oneteam.bizdemo.app
  CF_ZONE: bizdemo.app
  HAS_SECRETS: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - name: Secrets present?
        if: env.HAS_SECRETS != 'true'
        run: echo "::notice title=Deploy skipped::Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings → Secrets → Actions."
      - uses: actions/checkout@v4
        if: env.HAS_SECRETS == 'true'
      - uses: pnpm/action-setup@v4
        if: env.HAS_SECRETS == 'true'
      - uses: actions/setup-node@v4
        if: env.HAS_SECRETS == 'true'
        with: { node-version: 22, cache: pnpm }
      - name: Build
        if: env.HAS_SECRETS == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm -F @sms/web build
          test -f apps/web/dist/_headers && test -f apps/web/dist/_redirects
      - name: Create Pages project (idempotent)
        if: env.HAS_SECRETS == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages project create "$CF_PROJECT" --production-branch=main 2>&1 | tee /tmp/create.log || grep -qi "already exists" /tmp/create.log
      - name: Deploy to Pages
        if: env.HAS_SECRETS == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@3 pages deploy apps/web/dist --project-name="$CF_PROJECT" --branch=main --commit-dirty=true
      - name: Custom domain + DNS (idempotent)
        if: env.HAS_SECRETS == 'true'
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          api() { curl -sS -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$@"; }
          echo "== attach $CF_DOMAIN to Pages project $CF_PROJECT"
          api -X POST "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$CF_PROJECT/domains" --data "{\"name\":\"$CF_DOMAIN\"}" \
            | tee /tmp/domain.json | grep -Eo '"success":(true|false)|"message":"[^"]*"' | head -3 || true
          echo "== DNS"
          ZONE=$(api "https://api.cloudflare.com/client/v4/zones?name=$CF_ZONE" | python3 -c 'import sys,json; r=json.load(sys.stdin)["result"]; print(r[0]["id"] if r else "")')
          if [ -z "$ZONE" ]; then echo "::warning::zone $CF_ZONE not visible to this token (DNS read) — add the CNAME oneteam → $CF_PROJECT.pages.dev manually"; exit 0; fi
          EXISTING=$(api "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records?name=$CF_DOMAIN" | python3 -c 'import sys,json; r=json.load(sys.stdin)["result"]; print(";".join(f"{x[\"type\"]} {x[\"content\"]}" for x in r))')
          echo "existing: ${EXISTING:-none}"
          if [ -z "$EXISTING" ]; then
            api -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE/dns_records" --data "{\"type\":\"CNAME\",\"name\":\"oneteam\",\"content\":\"$CF_PROJECT.pages.dev\",\"proxied\":true,\"ttl\":1,\"comment\":\"Cloudflare Pages (bizdemo-sms)\"}" \
              | grep -Eo '"success":(true|false)|"message":"[^"]*"' | head -3 || echo "::warning::could not create CNAME (token lacks DNS:Edit?) — create it manually: CNAME oneteam → $CF_PROJECT.pages.dev (proxied)"
          fi
          echo "== domain status"
          api "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$CF_PROJECT/domains/$CF_DOMAIN" | python3 -c 'import sys,json; r=json.load(sys.stdin); print(json.dumps({k:r.get("result",{}).get(k) for k in ("name","status","verification_data","validation_data")}, ensure_ascii=False))' || true
