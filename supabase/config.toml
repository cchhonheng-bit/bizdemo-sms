# Supabase CLI config (local dev + `supabase config push`). Secrets are NOT stored here.
project_id = "bizdemo-sms"

[api]
enabled = true
port = 54321
# Only the `api` schema is exposed to PostgREST (S-04). Business tables live in `app`.
schemas = ["api"]
extra_search_path = ["api"]
max_rows = 500

[db]
port = 54322
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["https://oneteam.bizdemo.app", "https://staging.bizdemo.app"]
# S-05: short access tokens; refresh tokens rotate
jwt_expiry = 900
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# S-03: no public signup — users are created by CEO/Admin via the admin-users function
enable_signup = false
minimum_password_length = 8

[auth.email]
enable_signup = false
enable_confirmations = false

[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"

[functions.login]
verify_jwt = false          # public endpoint; rate-limited inside

[functions.admin-users]
verify_jwt = false          # D-27: gateway JWT check does not support the new signing keys; function calls auth.getUser()

[edge_runtime]
enabled = true

[functions.telegram-webhook]
verify_jwt = false          # Telegram calls it; protected by X-Telegram-Bot-Api-Secret-Token

[functions.telegram-sender]
verify_jwt = false          # cron secret header OR user JWT checked inside

[functions.resolve-maps-link]
verify_jwt = false          # D-27: auth.getUser() inside
