# One Team Service — the whole system: caddy (HTTPS) + app (TypeScript) + postgres. Nothing else (rule 1).
# Config comes from /opt/oneteam/.env (see .env.example). Start: docker compose up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: oneteam
      POSTGRES_USER: oneteam
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oneteam -d oneteam"]
      interval: 10s
      timeout: 5s
      retries: 10
    # no "ports": reachable only from the app container (rule 6)

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://oneteam:${DB_PASSWORD}@postgres:5432/oneteam
      PUBLIC_URL: https://${DOMAIN:?set DOMAIN in .env}
      TRUST_PROXY: "true"
      CRON: "true"
    volumes:
      - uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    # no "ports": reachable only through caddy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-admin@${DOMAIN}}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
